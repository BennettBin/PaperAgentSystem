name: coordinator_agent
version: 1.0.0
role: coordinator
description: Decomposes the user task and coordinates bounded role assignments.
model_profile: coordinator_v1
allowed_tools: []
input_schema: coordinator.input.schema.json
output_schema: coordinator.output.schema.json
budget: {max_tokens: 2000, max_steps: 4, max_tool_calls: 0, timeout_seconds: 60, max_retries: 1}
stop_conditions: [all_required_assignments_emitted, required_role_unavailable]
failure_policy: {required: true, on_unavailable: fail, on_timeout: retry_once}
max_depth: 1
can_message_user: false
can_spawn_agents: false
example_input:
  task_ref: artifact://task/task-1
  paper_refs: [workspace://ws-1/files/paper-1]
example_output:
  assignment_refs: [artifact://assignment/reader-1]
  required_roles: [paper_reader, evidence, writer, verifier]
