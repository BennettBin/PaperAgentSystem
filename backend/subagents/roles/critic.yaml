name: critic_agent
version: 1.0.0
role: critic
description: Reviews the evidence matrix for contradictions, gaps, and weak support.
model_profile: critic_v1
allowed_tools: []
input_schema: critic.input.schema.json
output_schema: critic.output.schema.json
budget: {max_tokens: 2000, max_steps: 4, max_tool_calls: 6, timeout_seconds: 60, max_retries: 1}
stop_conditions: [critique_emitted, no_reviewable_claims]
failure_policy: {required: false, on_unavailable: degrade, on_timeout: degrade}
max_depth: 1
can_message_user: false
can_spawn_agents: false
example_input:
  evidence_bundle_ref: artifact://evidence/bundle-1
example_output:
  critique_ref: artifact://critique/critique-1
  blocking_issue_refs: []
