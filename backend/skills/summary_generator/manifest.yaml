name: summary_generator
version: 1.0.0
description: 按用户目标总结论文内容，保留关键数字与证据覆盖。
model_profile: development
input_contract:
  format: object
  schema: input.schema.json
output_contract:
  format: markdown
  min_length: 8
trigger_conditions: [总结论文、章节或实验, 生成结构化摘要]
non_trigger_conditions: [核验单个主张, 综合多篇论文]
routing_keywords: [总结, 摘要, summar]
clarification_conditions: [缺少完成任务所需的论文、范围或目标]
termination_conditions: [已返回通过结构化契约校验的结果或明确失败原因]
acceptance_rules: [所有事实性内容保留证据或来源标识, 不得调用 Skill tools 目录以外的 Tool 或虚构论文内容]
