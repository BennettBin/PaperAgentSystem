name: limitation_analyst
version: 1.0.0
description: 区分作者明确陈述的局限与审阅者基于证据推断的局限。
model_profile: development
input_contract:
  format: object
  schema: input.schema.json
output_contract:
  format: markdown
  min_length: 8
trigger_conditions: [分析研究局限或威胁, 查找限制与未来工作]
non_trigger_conditions: [通用方法评审, 将推断冒充作者原话]
routing_keywords: [局限, 限制, limitation]
clarification_conditions: [缺少完成任务所需的论文、范围或目标]
termination_conditions: [已返回通过结构化契约校验的结果或明确失败原因]
acceptance_rules: [所有事实性内容保留证据或来源标识, 不得调用 Skill tools 目录以外的 Tool 或虚构论文内容]
