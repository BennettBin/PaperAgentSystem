name: paperagent

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.python
    args:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-main}
  restart: unless-stopped

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/conversations"]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    <<: *python-service
    command: ["uvicorn", "backend.apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: development
      ADAPTER_MODE: real
      DATABASE_URL: postgresql+psycopg://paperagent:${POSTGRES_PASSWORD:-paperagent-dev}@postgres:5432/paperagent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-paperagent}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-paperagent-dev-secret}
      MINIO_BUCKET_PREFIX: paperagent
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    ports:
      - "8000:8000"
    volumes:
      - ../../runtime/diagnostics/rag:/app/runtime/diagnostics/rag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *python-service
    command: ["python", "-m", "backend.apps.worker.runtime"]
    environment:
      DATABASE_URL: postgresql+psycopg://paperagent:${POSTGRES_PASSWORD:-paperagent-dev}@postgres:5432/paperagent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-paperagent}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-paperagent-dev-secret}
      MINIO_BUCKET_PREFIX: paperagent
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      AGENT_LOG_DIR: /app/runtime/logs/agent
      HF_HOME: /opt/huggingface
      SENTENCE_TRANSFORMERS_HOME: /opt/huggingface/sentence-transformers
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge_m3}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-main}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MAX_LENGTH: ${EMBEDDING_MAX_LENGTH:-512}
      EMBEDDING_USE_FP16: ${EMBEDDING_USE_FP16:-true}
      EMBEDDING_QUERY_TIMEOUT_MS: ${EMBEDDING_QUERY_TIMEOUT_MS:-300}
      EMBEDDING_BATCH_TIMEOUT_SECONDS: ${EMBEDDING_BATCH_TIMEOUT_SECONDS:-30}
      EMBEDDING_FALLBACK_ENABLED: ${EMBEDDING_FALLBACK_ENABLED:-true}
      EMBEDDING_QUERY_CACHE_TTL_SECONDS: ${EMBEDDING_QUERY_CACHE_TTL_SECONDS:-60}
      EMBEDDING_QUERY_CACHE_MAX_ENTRIES: ${EMBEDDING_QUERY_CACHE_MAX_ENTRIES:-512}
      SCHOLARLY_API_TIMEOUT_SECONDS: ${SCHOLARLY_API_TIMEOUT_SECONDS:-15}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      MULTI_AGENT_ENABLED: ${MULTI_AGENT_ENABLED:-true}
      ALLOW_EXPERIMENTAL_NO_GO: ${ALLOW_EXPERIMENTAL_NO_GO:-true}
      DYNAMIC_PLANNER_ENABLED: ${DYNAMIC_PLANNER_ENABLED:-true}
    volumes:
      - ../../runtime/logs/agent:/app/runtime/logs/agent
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: paperagent
      POSTGRES_USER: paperagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperagent-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperagent -d paperagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-paperagent-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-router:
    <<: *python-service
    command:
      ["python", "-m", "infrastructure.docker.service_runtime", "--service", "model-router", "--port", "8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  model-1-7b:
    <<: *python-service
    command:
      ["python", "-m", "infrastructure.docker.service_runtime", "--service", "model-1-7b", "--port", "8101"]
    profiles: ["models"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  model-4b:
    <<: *python-service
    command:
      ["python", "-m", "infrastructure.docker.service_runtime", "--service", "model-4b", "--port", "8104"]
    profiles: ["models"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  observability:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
